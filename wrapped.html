<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabyss — Your Week, Wrapped</title>
    <style>
      /* Wrapped is a deliberately committed dark, immersive experience —
         one visual world, like the format it winks at. */
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0b0b12;
        color: #fff;
        overflow: hidden;
        user-select: none;
      }
      .stage {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .blob {
        position: absolute; inset: -20%;
        background:
          radial-gradient(38% 45% at 25% 30%, var(--b1, #6d28d9) 0%, transparent 70%),
          radial-gradient(42% 48% at 75% 70%, var(--b2, #ec4899) 0%, transparent 70%);
        filter: blur(60px);
        opacity: 0.55;
        transition: opacity 0.8s;
        animation: drift 16s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from { transform: translate(-2%, -2%) scale(1); }
        to { transform: translate(2%, 3%) scale(1.08); }
      }
      .slide {
        position: relative;
        max-width: 640px;
        padding: 2rem 1.6rem;
        text-align: center;
        animation: pop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      @keyframes pop {
        from { opacity: 0; transform: translateY(24px) scale(0.96); }
        to { opacity: 1; transform: none; }
      }
      .kicker {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
        opacity: 0.7; margin-bottom: 1.1rem;
      }
      h1 { font-size: clamp(1.7rem, 5.5vw, 3rem); line-height: 1.08; letter-spacing: -0.02em; margin-bottom: 0.9rem; text-wrap: balance; }
      .sub { font-size: clamp(0.95rem, 2.4vw, 1.15rem); opacity: 0.85; line-height: 1.5; max-width: 46ch; margin: 0 auto; }
      .big-emoji { font-size: clamp(4rem, 14vw, 7.5rem); line-height: 1.1; margin-bottom: 0.6rem; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.45)); }
      .epithet {
        display: inline-block; margin-top: 0.9rem;
        font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem;
        padding: 0.3rem 0.9rem; border-radius: 100px;
        background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3);
      }
      .statline { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.2rem; }
      .schip { font-size: 0.85rem; padding: 0.35rem 0.85rem; border-radius: 100px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
      .dots { position: absolute; top: 1.1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 3; }
      .dots i { width: 22px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.25); transition: background 0.3s; }
      .dots i.on { background: #fff; }
      .navhint { position: absolute; bottom: 1.2rem; left: 50%; transform: translateX(-50%); font-size: 0.75rem; opacity: 0.5; z-index: 3; }
      .close { position: absolute; top: 0.9rem; right: 1.1rem; z-index: 3; font-size: 1.4rem; opacity: 0.6; cursor: pointer; background: none; border: none; color: #fff; }
      .close:hover { opacity: 1; }
      .sharebox { margin-top: 1.4rem; display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }
      canvas { width: min(320px, 70vw); height: auto; border-radius: 18px; box-shadow: 0 18px 60px rgba(0,0,0,0.5); }
      .btnrow { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
      .wbtn {
        font: inherit; font-weight: 640; cursor: pointer;
        padding: 0.65rem 1.2rem; border-radius: 100px; border: none;
        background: #fff; color: #0b0b12;
        transition: transform 0.15s;
      }
      .wbtn:hover { transform: scale(1.05); }
      .wbtn.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4); }
      .toggle { font-size: 0.8rem; opacity: 0.75; display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="blob" id="blob"></div>
      <div class="dots" id="dots"></div>
      <button class="close" id="close" title="Close">✕</button>
      <div class="slide" id="slide"></div>
      <div class="navhint">click / → to continue · ← to go back</div>
    </div>
    <script src="common.js"></script>
    <script src="wrapped.js"></script>
  </body>
</html>
