<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabyss Saved Pages</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="saved-pages-app">
    <header class="cc-header">
      <a class="brand-lockup cc-brand" href="dashboard.html" target="_blank" aria-label="Open Tabyss dashboard">
        <img class="brandmark" src="icon48.png" alt="" />
        <span class="brand-copy"><strong>Tabyss</strong><small>Saved pages · on-device</small></span>
      </a>
      <div class="cc-header-actions">
        <button id="savedDashboard" class="iconbtn" type="button" title="Dashboard" aria-label="Open dashboard">↗</button>
        <button id="savedSettings" class="iconbtn" type="button" title="Settings" aria-label="Open settings">⚙</button>
      </div>
    </header>

    <main class="saved-main">
      <section class="saved-hero" aria-labelledby="savedPageTitle">
        <div class="eyebrow">Keep it without keeping the tab</div>
        <h1 id="savedPageTitle">Saved pages</h1>
        <p>Save the page you are viewing, close the tab when you are ready, and come back later.</p>

        <form id="savedPageForm" class="saved-page-form">
          <label for="savedPageNote">Note <span>optional</span></label>
          <div class="saved-page-controls">
            <input id="savedPageNote" maxlength="240" autocomplete="off" placeholder="Why do you want to return?" />
            <button id="savePageSubmit" class="btn primary" type="submit">Save current page</button>
          </div>
        </form>
        <p class="saved-privacy">The page title and address stay on this device. Page content is never read.</p>
      </section>

      <p id="savedFeedback" class="cc-feedback" role="status" aria-live="polite" hidden></p>

      <section class="saved-library" aria-labelledby="savedListTitle">
        <div class="saved-list-heading">
          <h2 id="savedListTitle">Your pages</h2>
          <span id="savedPageCount" class="saved-count" aria-live="polite">0 saved</span>
        </div>
        <div class="filter-row" role="group" aria-label="Filter saved pages">
          <button class="filter-chip active" data-saved-filter="saved" type="button" aria-pressed="true">Saved</button>
          <button class="filter-chip" data-saved-filter="done" type="button" aria-pressed="false">Completed</button>
          <button class="filter-chip" data-saved-filter="all" type="button" aria-pressed="false">All</button>
        </div>
        <div id="savedPageList" class="saved-page-list" aria-live="polite"></div>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="product.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
